<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Портфолио">
  <!--
    Иконка вкладки: те же цвета и символ, что и на первом экране сайта,
    поэтому вкладка выглядит частью страницы, а не случайной картинкой.
    Нарисована линиями, а не текстом: текстовый элемент зависит от шрифтов
    системы, и в чужом браузере иконка поехала бы.
  -->
  <rect width="64" height="64" rx="14" fill="#101319" />
  <g
    fill="none"
    stroke="#8fa0ff"
    stroke-width="5"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <polyline points="23,19 11,32 23,45" />
    <polyline points="41,19 53,32 41,45" />
    <line x1="36" y1="15" x2="28" y2="49" />
  </g>
</svg>
