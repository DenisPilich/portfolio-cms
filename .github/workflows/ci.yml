name: Проверки

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest

    env:
      # Схема и конфиг Prisma требуют переменную на этапе генерации клиента,
      # хотя подключение к базе при этом не выполняется. Значение нужно
      # только чтобы конфиг загрузился.
      DATABASE_URL: "postgresql://user:password@localhost:5432/ci?sslmode=require"
      AUTH_SECRET: "ci-secret-not-used-for-real-sessions"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci запускает postinstall, который генерирует Prisma Client
      - run: npm ci

      - name: Проверка стиля кода
        run: npm run lint

      - name: Модульные тесты
        run: npm test

      # Продакшен-сборка здесь намеренно не запускается: публичные страницы
      # статические, и next build обращается к настоящей базе. Поднимать
      # PostgreSQL в CI только ради сборки — отдельная задача.
